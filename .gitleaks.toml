    "372c71526b084b7a56cf82b2cb093474d52d23b8",
    # Second commit — same key persisted in config.py before remediation
    # Remediated in security-hardening commit chain (0e07ac2 and later).
    "d15def74f7e70cb13c2727aae9464f7beb462804",
  ]
