# APEX FLOW — gitleaks configuration
#
# This file suppresses gitleaks findings for known historical secrets that:
#   1. Cannot be removed from the public git history without breaking all clones.
#   2. Have already been remediated: the SECRET_KEY was rotated in the Render
#      environment on 2026-09-08 and the value is no longer used anywhere.
#
# The allowlist is scoped to specific commit SHAs only (not rules, not paths).
# New secrets in new commits are NOT suppressed by this configuration.
#
# Reference: https://github.com/gitleaks/gitleaks#configuration

title = "APEX FLOW gitleaks configuration"

