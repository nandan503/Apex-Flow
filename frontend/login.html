<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - APEX FLOW | Smart Transport & Logistics</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body style="background: linear-gradient(135deg, var(--primary-dark), var(--primary-navy)); display:flex; align-items:center; justify-content:center; min-height:100vh;">

  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon" style="margin: 0 auto 14px auto;"></div>
      <h2>APEX <span style="color:var(--accent-blue);">FLOW</span></h2>
      <p style="color:var(--text-muted); font-size:13px; margin-top:4px;">Smarter Logistics. Faster Tomorrow.</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="admin@apexflow.com" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn" style="width:100%; justify-content:center; padding:12px; font-size:14px; margin-top:10px;">
        Sign In to Portal →
      </button>
    </form>

    <div style="margin-top:24px;">
      <p style="font-size:12px; font-weight:700; color:var(--primary-navy); margin-bottom:8px;">Quick Demo Logins:</p>
      <div class="demo-roles">
        <button class="demo-role-btn" onclick="selectDemoRole('admin@apexflow.com', 'Admin@123')">ADMIN</button>
        <button class="demo-role-btn" onclick="selectDemoRole('manager@apexflow.com', 'Manager@123')">MANAGER</button>
        <button class="demo-role-btn" onclick="selectDemoRole('driver@apexflow.com', 'Driver@123')">DRIVER</button>
        <button class="demo-role-btn" onclick="selectDemoRole('customer@apexflow.com', 'Customer@123')">CUSTOMER</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
