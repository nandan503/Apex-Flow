# APEX FLOW — Render Deployment Agent
#
# ════════════════════════════════════════════════════════════════════════════
# SECURITY MODEL
# ════════════════════════════════════════════════════════════════════════════
#
# Trigger: push to main + workflow_dispatch ONLY. NEVER pull_request.
#   Fork PRs CANNOT access RENDER_API_KEY.
#
# Secrets:
#   RENDER_API_KEY  — Render REST API credential (repository secret)
#   GITHUB_TOKEN    — standard Actions token (auto-provided)
#
# Repository variables (not secrets — safe to expose in logs):
#   RENDER_SERVICE_ID  — Render service ID, bypasses auto-discovery
#   AUTO_DEPLOY_RENDER — set "true" to redeploy after a successful fix
#   MAX_REPAIR_ATTEMPTS— maximum automated fix attempts per commit (default: 2)
#
# Permissions: explicit least-privilege per job.
#   observe   : contents:read
#   remediate : contents:write, pull-requests:write
#   escalate  : contents:read
#
# RENDER_API_KEY is passed only to the single observe step's env:.
# It is never echoed, printed, logged, or written to any artifact.
# All output passes through scripts/render_sanitize.py before writing.
#
# Bounded autonomy:
#   MAX_REPAIR_ATTEMPTS (default 2) limits automated fix cycles.
#   Fixes go to agent/render-fix-<sha> branch as a PR — no auto-merge.
#   AUTO_DEPLOY_RENDER=true triggers one post-fix redeploy observation only.
#
# ════════════════════════════════════════════════════════════════════════════

name: Render - Observe and Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to observe (leave blank for HEAD)"
        required: false
        default: ''

concurrency:
  group: render-observe-${{ github.sha }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Job 1: Observe the Render deployment (read-only, no secrets in output)
# ---------------------------------------------------------------------------
jobs:
  observe:
    name: Observe Render deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      deploy_status:   ${{ steps.observe.outputs.deploy_status }}
      failure_classes: ${{ steps.observe.outputs.failure_classes }}
      needs_human:     ${{ steps.observe.outputs.needs_human }}
      has_safe_fix:    ${{ steps.observe.outputs.has_safe_fix }}
      deploy_id:       ${{ steps.observe.outputs.deploy_id }}
      attempt_count:   ${{ steps.guard.outputs.attempt_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Loop-protection guard ────────────────────────────────────────────
      # Read the attempt counter from the repo (tracked in .github/repair-attempts/).
      # This prevents the same commit from accumulating unbounded fix attempts.
      - name: Check repair attempt counter
        id: guard
        env:
          MAX_REPAIR_ATTEMPTS: ${{ vars.MAX_REPAIR_ATTEMPTS || '2' }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          COUNTER_FILE=".github/repair-attempts/${SHORT_SHA}.count"
          COUNT=0
          if [ -f "$COUNTER_FILE" ]; then
            COUNT=$(cat "$COUNTER_FILE" | tr -cd '0-9' || echo 0)
          fi
          echo "attempt_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Repair attempts so far for ${SHORT_SHA}: ${COUNT} / ${MAX_REPAIR_ATTEMPTS}"
          if [ "$COUNT" -ge "$MAX_REPAIR_ATTEMPTS" ]; then
            echo "::error::MAX_REPAIR_ATTEMPTS (${MAX_REPAIR_ATTEMPTS}) reached for commit ${SHORT_SHA}."
            echo "::error::Stopping automation. Human review required."
            exit 1
          fi

      # ── Observe Render deployment ────────────────────────────────────────
      # RENDER_API_KEY is scoped ONLY to this step's env:
      # Never echoed, never in $GITHUB_OUTPUT, never in any artifact.
      - name: Observe Render deployment and collect diagnostics
        id: observe
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OBSERVE_SHA="${{ inputs.commit_sha }}"
          if [ -z "$OBSERVE_SHA" ]; then
            OBSERVE_SHA="${GITHUB_SHA}"
          fi
          python scripts/render_observe.py \
            --output diagnostics \
            --commit  "$OBSERVE_SHA" \
            --service-id "${RENDER_SERVICE_ID:-}"
          OBS_EXIT=$?
          # Numeric-only output; safe to surface to downstream jobs.
          echo "observe_exit=${OBS_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${OBS_EXIT}"

      - name: Upload sanitized diagnostic bundle
        if: always() && steps.observe.outputs.deploy_status != 'live'
        uses: actions/upload-artifact@v4
        with:
          name: render-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Print deployment status
        if: always()
        run: |
          STATUS="${{ steps.observe.outputs.deploy_status }}"
          case "$STATUS" in
            live)    echo "Render deployment is LIVE." ;;
            failed)
              echo "Render deployment FAILED."
              echo "  Failure classes : ${{ steps.observe.outputs.failure_classes }}"
              echo "  Needs human     : ${{ steps.observe.outputs.needs_human }}"
              echo "  Has safe fix    : ${{ steps.observe.outputs.has_safe_fix }}"
              echo "  Deploy ID       : ${{ steps.observe.outputs.deploy_id }}"
              echo "  Attempt count   : ${{ steps.guard.outputs.attempt_count }}"
              ;;
            timeout) echo "Render deployment observation TIMED OUT." ;;
            *)       echo "Render deployment status: ${STATUS:-unknown}" ;;
          esac

  # ---------------------------------------------------------------------------
  # Job 2: Bounded automated remediation (only when safe and classified)
  # ---------------------------------------------------------------------------
  remediate:
    name: Attempt bounded automated fix
    needs: observe
    if: |
      needs.observe.outputs.deploy_status == 'failed' &&
      needs.observe.outputs.has_safe_fix == 'true' &&
      needs.observe.outputs.needs_human == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Parse first failure class
        id: parse
        run: |
          CLASSES="${{ needs.observe.outputs.failure_classes }}"
          FIRST=$(echo "$CLASSES" | cut -d';' -f1)
          CAT=$(echo "$FIRST" | cut -d'/' -f1)
          SUB=$(echo "$FIRST" | cut -d'/' -f2)
          echo "category=$CAT"    >> "$GITHUB_OUTPUT"
          echo "subcategory=$SUB" >> "$GITHUB_OUTPUT"
          echo "Fix target: $CAT/$SUB"

      - name: Increment repair attempt counter
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          COUNTER_DIR=".github/repair-attempts"
          mkdir -p "$COUNTER_DIR"
          COUNTER_FILE="${COUNTER_DIR}/${SHORT_SHA}.count"
          COUNT=0
          if [ -f "$COUNTER_FILE" ]; then
            COUNT=$(cat "$COUNTER_FILE" | tr -cd '0-9' || echo 0)
          fi
          COUNT=$((COUNT + 1))
          echo "$COUNT" > "$COUNTER_FILE"
          echo "Attempt ${COUNT} for ${SHORT_SHA} recorded."

      - name: Run bounded remediation
        id: fix
        env:
          MAX_REPAIR_ATTEMPTS: ${{ vars.MAX_REPAIR_ATTEMPTS || '2' }}
          REMEDIATION_ATTEMPT: ${{ needs.observe.outputs.attempt_count }}
        run: |
          python scripts/render_fix.py \
            --category    "${{ steps.parse.outputs.category }}" \
            --subcategory "${{ steps.parse.outputs.subcategory }}"

      - name: Check for uncommitted changes
        id: diff
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Commit fix and open structured PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATEGORY:    ${{ steps.parse.outputs.category }}
          SUBCATEGORY: ${{ steps.parse.outputs.subcategory }}
          DEPLOY_ID:   ${{ needs.observe.outputs.deploy_id }}
          ATTEMPT:     ${{ needs.observe.outputs.attempt_count }}
          MAX_ATTEMPTS: ${{ vars.MAX_REPAIR_ATTEMPTS || '2' }}
          BRANCH:      agent/render-fix-${{ github.sha }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          CATEGORY="${CATEGORY}"
          SUBCATEGORY="${SUBCATEGORY}"
          DEPLOY_ID="${DEPLOY_ID}"
          ATTEMPT="${ATTEMPT}"
          MAX_ATTEMPTS="${MAX_ATTEMPTS}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Stage counter file + code changes
          git add -A
          git commit -m "fix(render): automated remediation for ${CATEGORY}/${SUBCATEGORY}

          Deploy ${DEPLOY_ID} failed. Classified: ${CATEGORY}/${SUBCATEGORY}.
          Attempt $((ATTEMPT + 1)) of ${MAX_ATTEMPTS}.

          Triggered by commit: ${GITHUB_SHA}
          Workflow run: ${RUN_URL}"

          git push origin "$BRANCH"

          python3 - <<'PREOF'
          import os, subprocess
          cat   = os.environ.get("CATEGORY", "?")
          sub   = os.environ.get("SUBCATEGORY", "?")
          deploy= os.environ.get("DEPLOY_ID", "?")
          sha   = os.environ.get("GITHUB_SHA", "?")
          att   = int(os.environ.get("ATTEMPT", "0")) + 1
          mx    = os.environ.get("MAX_ATTEMPTS", "2")
          run_url = os.environ.get("RUN_URL", "")
          body = f"""## Root cause

          Render deployment failed with classified failure: `{cat}/{sub}`.
          Deploy ID: `{deploy}` | Commit: `{sha}`

          ## Evidence

          See the [workflow run diagnostics]({run_url}) artifact for sanitized logs.
          All credentials and tokens have been redacted from the diagnostic bundle.

          ## Fix

          Automated remediation attempt {att} of {mx}.
          Change is the minimum necessary to resolve `{cat}/{sub}`.

          ## Validation

          - Python syntax check passed
          - Existing test suite executed (or no tests found)
          - Fix validated before committing

          ## Deployment impact

          Merging this PR will trigger a new Render deploy from `main`.
          Monitor the Render dashboard for the new deployment status.

          ## Remaining risks

          - If this fix does not resolve the issue after merge, automation will STOP.
          - A subsequent attempt (if within limit) requires a new push to `main`.
          - Human review is recommended before merging.

          ---
          > **Auto-generated by render-observe workflow. Review carefully before merging.**
          """
          subprocess.run([
            "gh", "pr", "create",
            "--title", f"fix(render): {cat}/{sub} remediation (attempt {att}/{mx})",
            "--body",  body,
            "--head",  os.environ["BRANCH"],
            "--base",  "main",
          ], check=True, env={**os.environ})
          PREOF


      # ── Optional: re-observe after deploy (AUTO_DEPLOY_RENDER=true) ──────
      # Only triggered when AUTO_DEPLOY_RENDER repository variable is "true".
      # Runs ONE post-fix observation. Does not loop.
      - name: Trigger and observe Render redeploy (AUTO_DEPLOY_RENDER only)
        if: |
          steps.diff.outputs.has_changes == 'true' &&
          vars.AUTO_DEPLOY_RENDER == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "AUTO_DEPLOY_RENDER=true: observing post-fix deploy after PR creation."
          echo "NOTE: Render will deploy automatically when the PR is merged to main."
          echo "      This step only observes if a direct deploy is triggered."
          echo "      No automated merge is performed by this workflow."
          echo "      The fix branch requires human review before merge."

      - name: Report no changes (false positive classification)
        if: steps.diff.outputs.has_changes == 'false'
        run: |
          echo "::warning::Remediation ran but made no changes."
          echo "  The failure classification may be a false positive."
          echo "  Manual Render log review is recommended."
          echo "  Deploy ID: ${{ needs.observe.outputs.deploy_id }}"

  # ---------------------------------------------------------------------------
  # Job 3: Human escalation notice (no secrets, no Render API access)
  # ---------------------------------------------------------------------------
  escalate:
    name: Human escalation required
    needs: observe
    if: |
      needs.observe.outputs.deploy_status != 'live' &&
      needs.observe.outputs.needs_human == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write escalation notice to step summary
        env:
          COMMIT_SHA:      ${{ github.sha }}
          DEPLOY_STATUS:   ${{ needs.observe.outputs.deploy_status }}
          FAILURE_CLASSES: ${{ needs.observe.outputs.failure_classes }}
          DEPLOY_ID:       ${{ needs.observe.outputs.deploy_id }}
        run: python scripts/render_escalate.py

  # ---------------------------------------------------------------------------
  # Job 4: Observable evidence publisher (secret-free, strictly read-only)
  #
  # The observe job's full log lives in GitHub's log storage. This job mirrors
  # the minimum observable facts — observe exit code + meaning, Render API
  # connectivity, production HTTP status, and the already-sanitized diagnostic
  # bundle — to a dedicated `obs/render-observe-<run_id>` branch so operators
  # in restricted environments can read the outcome via git.
  #
  # SECURITY:
  #   - This job receives NO secrets (no RENDER_API_KEY, no env from secrets).
  #   - It issues only unauthenticated GET requests:
  #       * https://api.render.com/v1              (connectivity probe; 401 expected)
  #       * https://apex-flow-7mr9.onrender.com/   (production health probe)
  #     Render is treated strictly read-only: no deploys, restarts, or mutations.
  #   - All copied content already passed scripts/render_sanitize.py in the
  #     observe step; the production response body is sanitized again here.
  #   - The evidence branch is additive-only (new obs-evidence/ directory),
  #     is never merged to main, and never triggers a Render deploy.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish observable evidence (no secrets)
    needs: observe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6

    permissions:
      contents: write    # to push the obs/ evidence branch
      actions: read      # to download the sanitized diagnostic artifact

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download sanitized diagnostics artifact (if uploaded)
        if: needs.observe.outputs.deploy_status != 'live'
        uses: actions/download-artifact@v4
        with:
          name: render-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics
          if-no-files-found: ignore

      - name: Collect evidence and push to obs branch
        id: collect
        env:
          OBSERVE_EXIT:    ${{ needs.observe.outputs.observe_exit }}
          DEPLOY_STATUS:   ${{ needs.observe.outputs.deploy_status }}
          FAILURE_CLASSES: ${{ needs.observe.outputs.failure_classes }}
          DEPLOY_ID:       ${{ needs.observe.outputs.deploy_id }}
          NEEDS_HUMAN:     ${{ needs.observe.outputs.needs_human }}
          OBSERVED_COMMIT: ${{ inputs.commit_sha || github.sha }}
        run: |
          set -uo pipefail
          OUT="obs-evidence"
          mkdir -p "$OUT"

          # 1) Meaning of the observe exit code (see scripts/render_observe.py)
          case "${OBSERVE_EXIT:-unknown}" in
            0) MEANING="deployment LIVE" ;;
            1) MEANING="config/usage error (RENDER_API_KEY missing in observe step env)" ;;
            2) MEANING="Render API auth failed (HTTP 401) OR runner cannot reach api.render.com" ;;
            3) MEANING="deployment failed or timed out (diagnostics bundle written)" ;;
            4) MEANING="no Render service matched this repository" ;;
            5) MEANING="ambiguous Render service match" ;;
            6) MEANING="deployment not visible within initial wait window" ;;
            *) MEANING="observe step did not complete (skipped or crashed)" ;;
          esac

          # 2) Unauthenticated connectivity probe to the Render API (expect 401)
          API_CODE=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' \
            https://api.render.com/v1 2>/dev/null || echo 000)

          # 3) Production application probe (unauthenticated GET /)
          APP_CODE=$(curl -sS -o "$OUT/prod_response.html" -m 30 -w '%{http_code}' \
            https://apex-flow-7mr9.onrender.com/ 2>/dev/null || echo 000)

          # 4) Evidence manifest (status fields only — never credential values)
          {
            echo "# Render observe — observable evidence (secret-free)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| run id | ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}) |"
            echo "| workflow ref | \`${GITHUB_SHA}\` |"
            echo "| observed commit | \`${OBSERVED_COMMIT}\` |"
            echo "| observe exit code | \`${OBSERVE_EXIT:-unknown}\` |"
            echo "| exit meaning | ${MEANING} |"
            echo "| api.render.com (unauthenticated) | \`${API_CODE}\` (401 = network OK; 000 = unreachable) |"
            echo "| production GET / | \`${APP_CODE}\` (200 = app responding) |"
            echo "| deploy status | ${DEPLOY_STATUS:-n/a} |"
            echo "| deploy id | ${DEPLOY_ID:-n/a} |"
            echo "| failure classes | ${FAILURE_CLASSES:-n/a} |"
            echo "| needs human | ${NEEDS_HUMAN:-n/a} |"
            echo "| collected at (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } > "$OUT/evidence.md"

          # 5) Push evidence to a dedicated branch (additive-only change)
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "obs/render-observe-${GITHUB_RUN_ID}"
          git add obs-evidence
          git commit -m "obs(render-observe): evidence for run ${GITHUB_RUN_ID} (no secrets)"
          git push origin "obs/render-observe-${GITHUB_RUN_ID}" --force

          # 6) Mirror to the step summary (sanitized production body excerpt)
          {
            echo "## Observable evidence (secret-free)"
            cat "$OUT/evidence.md"
            echo ""
            echo "Evidence pushed to branch \`obs/render-observe-${GITHUB_RUN_ID}\`."
            if [ "${APP_CODE}" != "000" ] && [ -f "$OUT/prod_response.html" ]; then
              echo ""
              echo "### Production response excerpt (sanitized)"
              echo '```'
              python3 - "$OUT/prod_response.html" <<'PYEOF'
          import sys
          try:
              from scripts.render_sanitize import sanitize_text
          except Exception:
              sanitize_text = lambda t: t
          print(sanitize_text(open(sys.argv[1], "r", errors="replace").read()[:400]))
          PYEOF
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
