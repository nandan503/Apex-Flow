name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Security regression tests
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          FLASK_ENV: development
        run: pytest -q
      - name: Guard demo passwords in shipped UI
        run: |
          if grep -R -n "Admin@123" frontend/login.html; then
            echo "Demo admin password must not ship in login.html"
            exit 1
          fi
