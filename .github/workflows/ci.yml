name: PostgreSQL security contracts
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apex_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Non-owner PostgreSQL integration and adversarial tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres@localhost:5432/apex_test
        run: pytest -q
      - name: Audit runtime lockfile
        run: pip-audit -r requirements.txt
      - name: Compile and scan shipped source for obsolete credential fallbacks
        run: |
          python -m compileall -q backend
          python - <<'PY'
          from pathlib import Path
          banned = [role + '@' + '123' for role in ('Admin', 'Manager', 'Driver', 'Customer')]
          for root in ('backend', 'frontend'):
              for path in Path(root).rglob('*'):
                  if path.is_file() and path.suffix in ('.py', '.js', '.html'):
                      assert not any(x in path.read_text() for x in banned), str(path)
          PY
