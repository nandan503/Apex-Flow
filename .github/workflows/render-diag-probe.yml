# TEMPORARY diagnostic harness: runs the Render diagnostics collector on push
# and persists sanitized artifacts to the render-diag-output branch. Removed
# after use — main keeps only the workflow_dispatch render-diagnostics.yml.
name: Render diagnostics (temp push harness)
on:
  push:
    branches: ['arena/**']

permissions:
  contents: write

jobs:
  render-diagnostics:
    name: Collect sanitized Render diagnostics
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect Render diagnostics and canonical health
        id: collect
        continue-on-error: true
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_LOG_LOOKBACK_MINUTES: '30'
        run: python scripts/render_diagnostics.py --output diagnostics --lookback-minutes 30 || echo "COLLECTOR_EXIT=$?" >> "$GITHUB_ENV"
      - name: Persist artifacts to render-diag-output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_EXIT: ${{ env.COLLECTOR_EXIT }}
        run: |
          mkdir -p diagnostics
          echo "COLLECTOR_EXIT=${COLLECTOR_EXIT:-unknown}" > diagnostics/collector-exit.txt
          git config user.name "apex-diag-bot"
          git config user.email "apex-diag-bot@users.noreply.github.com"
          git add diagnostics
          git commit -m "render diagnostics for ${GITHUB_SHA} (exit ${COLLECTOR_EXIT:-unknown})" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/nandan503/Apex-Flow.git" HEAD:render-diag-output
