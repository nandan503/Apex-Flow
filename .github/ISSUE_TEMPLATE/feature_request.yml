name: Feature request
description: Propose a new feature or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the operational or user-facing gap this addresses.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Be specific about API changes, UI changes, or new behaviour.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area affected
      multiple: true
      options:
        - Backend API
        - Frontend
        - Authentication / RBAC
        - Database / Schema
        - Deployment / CI
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this has not been requested before.
          required: true
