# APEX FLOW Pre-commit Security Hooks
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  # Secret scanning — blocks commits containing API keys, passwords, tokens
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        description: Prevents committing passwords, tokens, and API keys

  # Semgrep SAST — custom APEX FLOW security rules
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.45.0
    hooks:
      - id: semgrep
        name: SAST scan (Semgrep - APEX FLOW rules)
        args: ['--config', '.semgrep.yml', '--error', 'backend/']
        pass_filenames: false

  # Trailing whitespace and syntax checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
        name: Detect private keys in codebase
